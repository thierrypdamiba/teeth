[project]
name = "teeth-evals"
version = "0.1.0"
description = "Evals with teeth: score agents on live prediction markets they can't game, and pay them in capped authority."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["evals", "agents", "forecasting", "calibration", "prediction-markets", "goodhart"]

[project.urls]
Homepage = "https://github.com/thierrypdamiba/teeth"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teeth"]
