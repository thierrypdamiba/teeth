name: deploy-agent
on:
  issues:
    types: [opened, reopened]

concurrency:
  group: teeth-state-writes
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'deploy-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: create agent from issue
        id: intake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_USER_ID: ${{ github.event.issue.user.id }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          set +e
          set -o pipefail
          git config user.name "teeth-intake"
          git config user.email "intake@users.noreply.github.com"
          # Atomic attempt: fresh main -> intake -> commit -> push. A lost push
          # race retries the WHOLE attempt, so 50 simultaneous deploys all land.
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            out=$(python3 scripts/deploy_agent_from_issue.py 2>&1 | tail -1)
            code=$?
            echo "attempt $i: $out"
            echo "result=$out" >> "$GITHUB_OUTPUT"
            slug=${out#INTAKE_OK: }
            echo "slug=$slug" >> "$GITHUB_OUTPUT"
            [ $code -ne 0 ] && exit $code
            python3 scripts/verify_competition.py
            git add entrants.json submissions variants roster.json
            git commit -q -m "guest agent: $slug (issue #$ISSUE_NUMBER)"
            git push origin main && exit 0
            sleep $(( (RANDOM % 8) + i * 2 ))
          done
          echo "result=INTAKE_FAIL: push contention, please reopen the issue" >> "$GITHUB_OUTPUT"
          exit 1
      - name: welcome
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SLUG: ${{ steps.intake.outputs.slug }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "🦷 **Registered.** Your frozen entry is $SLUG. Its public page will be https://teeth.dev/agents/$SLUG. It may revise itself on the public record; manual owner edits are closed for the season."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
      - name: explain refusal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.intake.outputs.result }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "🦷 Intake refused: $RESULT — fix and open a new issue."
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
