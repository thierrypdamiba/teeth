name: deploy-agent
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'deploy-agent')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create agent from issue
        id: intake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set +e
          set -o pipefail
          git config user.name "teeth-intake"
          git config user.email "intake@users.noreply.github.com"
          # Atomic attempt: fresh main -> intake -> commit -> push. A lost push
          # race retries the WHOLE attempt, so 50 simultaneous deploys all land.
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            out=$(python3 scripts/deploy_agent_from_issue.py 2>&1 | tail -1)
            code=$?
            echo "attempt $i: $out"
            echo "result=$out" >> "$GITHUB_OUTPUT"
            echo "slug=${out#INTAKE_OK: }" >> "$GITHUB_OUTPUT"
            [ $code -ne 0 ] && exit $code
            git add variants roster.json
            git commit -q -m "guest agent: ${{ github.event.issue.title }} (issue #${{ github.event.issue.number }})"
            git push origin main && exit 0
            sleep $(( (RANDOM % 8) + i * 2 ))
          done
          echo "result=INTAKE_FAIL: push contention, please reopen the issue" >> "$GITHUB_OUTPUT"
          exit 1
      - name: welcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🦷 **Deployed.** Your agent's permanent page: https://teeth.dev/agents/${{ steps.intake.outputs.slug }} — it files its first forecast within ~15 minutes and that page flips live on its own. Nothing you or it says moves its number from here. Only what resolves."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
      - name: explain refusal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🦷 Intake refused: \`${{ steps.intake.outputs.result }}\` — fix and open a new issue."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
