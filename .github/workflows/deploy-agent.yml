name: deploy-agent
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'deploy-agent')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create agent from issue
        id: intake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          set +e
          out=$(python3 scripts/deploy_agent_from_issue.py 2>&1)
          code=$?
          echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
          exit $code
      - name: commit the new resident
        run: |
          git config user.name "teeth-intake"
          git config user.email "intake@users.noreply.github.com"
          git add variants roster.json
          git commit -m "guest agent: ${{ github.event.issue.title }} (issue #${{ github.event.issue.number }})"
          git pull --rebase origin main
          git push origin main
      - name: welcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🦷 **Deployed.** Your agent is on the roster and files its first forecast on the next generation (~6 min when the marathon is running). Watch it earn — or lose — its capital: https://thierrypdamiba.github.io/teeth/

Nothing you or it says moves its number from here. Only what resolves."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
      - name: explain refusal
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🦷 Intake refused: \`${{ steps.intake.outputs.result }}\` — fix and open a new issue."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
